name: Public browser checks
on:
  push:
    branches: [feature/field-guide-card, feature/album-experience]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-browser-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.5'
      - run: npm install --global pnpm@10.34.5
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: node scripts/audit-source.mjs
      - run: node scripts/generate-gallery-snapshots.cjs --check
      - run: node scripts/audit-cleanup.mjs
      - name: Build the production application
        run: pnpm build
      - run: pnpm check:catalogue-loading
      - run: node scripts/profile-route-bundles.mjs --check-deferred-geometry
      - run: node scripts/check-performance-budgets.mjs
      - name: Check deployable public HTML and decoded size budgets
        run: |
          node node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 3100 > /tmp/aves-candidate-http.log 2>&1 &
          candidate_pid=$!
          trap 'kill "$candidate_pid" 2>/dev/null || true' EXIT
          python3 scripts/audit-public-http.py --base-url http://127.0.0.1:3100 --wait-for-ready --check-budgets --output /tmp/aves-candidate-http.json
      - run: pnpm exec playwright install --with-deps chromium firefox
      - name: Check narrow-phone consent and regional navigation first
        run: pnpm exec playwright test tests/browser/brand-location.spec.ts --project=phone-320
      # Synthetic routes change shared chunk allocation. Measure the deployable
      # application above, then build the isolated form harness for browser QA.
      - run: node scripts/prepare-browser-fixtures.mjs
        env:
          AVES_BROWSER_FIXTURES: '1'
      - name: Build the isolated browser harness
        run: pnpm build
      - name: Check the new private album and offline journeys first
        run: pnpm exec playwright test tests/browser/bird-library-completion.spec.ts tests/browser/batch-79-88.spec.ts tests/browser/audit-queue.spec.ts tests/browser/private-itinerary-collection.spec.ts tests/browser/design-polish.spec.ts tests/browser/final-repairs.spec.ts --project=desktop --project=phone-390
      - run: pnpm test:browser
